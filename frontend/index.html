<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digi Save WAF - Login</title>
    <meta name="description" content="Digi Save - Web Application Firewall Login">
    <link rel="stylesheet" href="/css/style.css?v=5.0.0">
</head>
<body>
    <div class="login-container">
        <div class="login-card fade-in">
            <div class="login-logo">
                <div class="logo-icon">&#128737;</div>
                <h1>Digi Save</h1>
                <p>Web Application Firewall</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter your username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
                <div id="loginError" style="color:var(--danger);font-size:13px;margin-bottom:16px;display:none"></div>
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
                    Sign In
                </button>
            </form>

            <div style="text-align:center;margin-top:24px;color:var(--text-muted);font-size:12px">
                Protected by Digi Save WAF v2.1.0
            </div>
        </div>
    </div>

    <script src="/js/app.js?v=5.0.0"></script>
    <script>
        // If already logged in, redirect to dashboard
        if (getToken()) window.location.href = '/dashboard';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('loginError');
            errEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const data = await apiPost('/login', {
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                });
                setToken(data.access_token);
                setUsername(data.username);
                window.location.href = '/dashboard';
            } catch (err) {
                errEl.textContent = err.message || 'Login failed';
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
